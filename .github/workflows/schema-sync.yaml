name: Schema sync

on:
  push:
    branches:
      - main
    paths:
      - "internal/schema/**"
      - "scripts/check-schema-sync.sh"
      - ".github/workflows/schema-sync.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "internal/schema/**"
      - "scripts/check-schema-sync.sh"
      - ".github/workflows/schema-sync.yaml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read the pinned dp1 commit
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < internal/schema/dp1-commit.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: display-protocol/dp1
          ref: ${{ steps.pin.outputs.sha }}
          path: .dp1
          persist-credentials: false
      - name: Embedded schemas match the pinned spec
        run: bash scripts/check-schema-sync.sh .dp1
